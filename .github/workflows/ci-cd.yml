name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Bandit + Semgrep, Gemini mocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: bandit --version && semgrep --version
      - run: python -m pytest -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  deploy:
    name: Deploy to Vercel
    needs: [backend-tests, frontend-build, docker-build]
    # Production on pushes to main; preview deployments for pull requests from this repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets are not set yet, skipping deployment (see README)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"
      - name: Pull Vercel project settings
        if: steps.secrets.outputs.ready == 'true'
        run: npx --yes vercel@latest pull --yes --environment=$TARGET --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ "$TARGET" = production ]; then
            npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          else
            npx --yes vercel@latest build --token="$VERCEL_TOKEN"
          fi
      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if [ "$TARGET" = production ]; then
            url=$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          else
            url=$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"
      - name: Smoke test
        if: steps.secrets.outputs.ready == 'true' && env.TARGET == 'production'
        # The unique deployment URL may sit behind Vercel's deployment protection (401);
        # that still proves the deployment is up. Anything else (5xx, 404) fails the job.
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.deploy.outputs.url }}/api/health")
            echo "attempt $i: HTTP $code"
            if [ "$code" = 200 ] || [ "$code" = 401 ]; then exit 0; fi
            sleep 10
          done
          echo "Health check failed" && exit 1
